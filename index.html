<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Catálogo | Distribuciones Castro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col antialiased">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
    <div class="max-w-5xl mx-auto px-3 sm:px-6 py-2.5 flex items-center gap-2.5">
      <img id="cc-logo" src="" alt="" class="hidden w-11 h-11 rounded-xl object-cover shadow-md">
      <div class="min-w-0 flex-1">
        <h1 id="cc-company" class="text-sm font-extrabold text-slate-900 leading-tight truncate">Catálogo</h1>
        <p id="cc-seller" class="text-[11px] text-slate-500 truncate"></p>
      </div>
      <button onclick="toggleCart(true)" class="relative h-11 px-3.5 flex items-center gap-2 rounded-xl bg-emerald-600 active:bg-emerald-700 text-white transition touch-manipulation">
        <i class="fa-solid fa-cart-shopping text-sm"></i>
        <span id="cart-count" class="text-xs font-bold">0</span>
      </button>
    </div>
    <div class="max-w-5xl mx-auto px-3 sm:px-6 pb-2.5">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-4 top-4 text-slate-400 text-sm"></i>
        <input type="text" id="cc-search" oninput="renderGrid()" placeholder="Buscar producto..." class="w-full pl-11 pr-4 py-3.5 text-base rounded-2xl bg-slate-100 border border-transparent focus:border-blue-500 focus:bg-white focus:outline-none transition">
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-3 sm:px-6 pt-4 pb-28 flex-1 w-full">
    <div id="cc-headline" class="text-sm text-slate-600 mb-3"></div>
    <div id="cc-loading" class="text-center py-16 px-4">
      <i class="fa-solid fa-spinner fa-spin text-2xl text-blue-600"></i>
      <p class="text-xs text-slate-500 mt-3">Descargando catálogo e imágenes...</p>
    </div>
    <div id="cc-empty" class="hidden text-center py-16 px-4 bg-white rounded-3xl border border-slate-200 max-w-md mx-auto my-8">
      <div class="w-16 h-16 rounded-2xl bg-amber-50 text-amber-500 flex items-center justify-center text-2xl mx-auto mb-3">
        <i class="fa-solid fa-box-open"></i>
      </div>
      <h3 class="text-base font-bold text-slate-900 mb-1">Sin productos</h3>
      <p id="cc-empty-msg" class="text-xs text-slate-500 leading-relaxed">Aún no hay productos publicados.</p>
    </div>
    <div id="cc-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 sm:gap-4"></div>
  </main>

  <!-- Offer Modal -->
  <div id="cc-offer" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-end sm:items-center justify-center sm:p-4">
    <div class="bg-white rounded-t-3xl sm:rounded-2xl w-full max-w-md overflow-hidden shadow-2xl">
      <img id="cc-offer-image" src="" alt="Oferta" class="w-full h-44 object-cover">
      <div class="p-5">
        <h3 id="cc-offer-title" class="text-base font-extrabold text-slate-900"></h3>
        <div class="mt-4 flex gap-2">
          <button onclick="closeOffer()" class="flex-1 py-2.5 bg-slate-100 text-slate-600 rounded-xl text-sm font-bold">Cerrar</button>
          <button id="cc-offer-cta" onclick="closeOffer()" class="flex-1 py-2.5 bg-blue-600 text-white rounded-xl text-sm font-bold">Ver productos</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Cart Drawer -->
  <div id="cc-cart" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-end sm:items-center justify-center sm:p-4">
    <div class="bg-white rounded-t-3xl sm:rounded-2xl w-full max-w-md max-h-[92dvh] flex flex-col shadow-2xl overflow-hidden">
      <div class="p-4 border-b border-slate-100 flex items-center justify-between">
        <h3 class="text-sm font-bold text-slate-900">Tu consulta</h3>
        <button onclick="toggleCart(false)" class="w-8 h-8 rounded-lg text-slate-400 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="cc-cart-items" class="divide-y divide-slate-100 overflow-y-auto flex-1 p-2"></div>
      <div class="p-4 border-t border-slate-100">
        <button onclick="sendOrder()" class="w-full py-3 bg-emerald-600 active:bg-emerald-700 text-white rounded-xl text-sm font-bold transition flex items-center justify-center gap-2">
          <i class="fa-brands fa-whatsapp text-base"></i>
          <span id="cc-send-label">Enviar por WhatsApp</span>
        </button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
